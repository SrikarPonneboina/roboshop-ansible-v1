- name: create ec2 instance and route 53 records
  hosts: local
  connection: local
  vars:
    aws_region: "us-east-1"
    ami_id: "ami-0055977a6e828a4f4"
    instance_type: "t3.micro"
    #when you give it in commandline these variables will be overwritten
    #cmd: ansible-playbook roboshop.yaml -e "instances: ['mongodb','redis']"
    instances: ['mongodb','redis','mysql','rabbitmq']
    domain_name: "srikarlabs.space"
    action: create
    #action= delete you can give in the commandline directly as it overwrites other variables in this file
    # ansible-playbook roboshop.yaml -e "action=delete"
  tasks: 
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: "{{ instance_type }}"
      security_groups: ["roboshop-common", "roboshop-{{ item }}"]
      region: "{{ aws_region }}"
    loop: "{{ instances }}"
    when: action == "create"
    register: ec2_output

  - name: print ec2-instance output
    debug:
      msg: "{{ ec2_output }}"

  - name: create r53 dns records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}" #mongodb.srikarlabs.space
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}" 
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: action == "create"

  - name: create r53 record for frontend  
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: action == "create" and item.item == "frontend"

  - name: delete r53 record
    amazon.aws.route53: 
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ item }}.{{ domain_name }}"
      type: A
      ttl: 1
    when: action == "delete"
  
  - name: delete r53 record for frontend
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}"
      type: A
      ttl: 1
    when: action == "delete"

  - name: delete ec2 instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      state: absent
      region: "{{ aws_region }}"
      wait: false # when wait=false..check in points to check
    loop: "{{ instances }}"
    when: action == "delete"  
  

