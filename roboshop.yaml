- name: create ec2 instance and route 53 records
  hosts: local
  connection: local
  vars:
    aws_region: "us-east-1"
    ami_id: "ami-0055977a6e828a4f4"
    instance_type: "t3.micro"
    instance: ['mongodb','redis']
    domain_name: "srikarlabs.space"
  tasks: 
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: "{{ instance_type }}"
      security_groups: ["roboshop-common", "roboshop-{{ item }}"]
      region: "{{ aws_region }}"
    loop: "{{ instance }}"
    register: ec2_output

  - name: print ec2-instance output
    debug:
      msg: "{{ ec2_output }}"

  - name: update r53 dns records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}" #mongodb.srikarlabs.space
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}" 
      overwrite: true
      loop: "{{ ec2_output.results }}"














