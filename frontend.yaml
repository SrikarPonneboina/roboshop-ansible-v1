- name: configure and deploy frontend server
  hosts: frontend
  become: true
  tasks:
  - name: disable and enable nginx version:1.26
    shell: |
      dnf module disable nginx -y 
      dnf module enable nginx:1.26 -y
  
  - name: download nginx
    dnf:
      name: nginx
      state: present
  
  - name: enable and start service
    service:
      name: nginx
      state: started
      enabled: true
    
  - name: remove default content from the folder nginx-html 
    find:
      paths: /usr/share/nginx/html/
      recurse: true
      file_type: any 
      hidden: true
    register: folder_contents
  
  - name: print folder contents
    debug:
      msg: "{{ folder_contents }}"
  
  - name: delete all found items 
    file:
      path: "{{ item.path }}"
      state: absent
    loop: "{{ folder_contents.files }}"
  
  - name: create /app directory
    file:
      path: /app
      state: directory
      
  - name: download frontend application code
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/frontend-v4.zip
      dest: /tmp/frontend.zip

  - name: unzip frontend in /app directory
    unarchive:
      src: /tmp/frontend.zip
      dest: /app
      remote_src: true
  
  - name: copy roboshop config file
    template:
      src: roboshop.conf.j2
      dest: /etc/nginx/defalt.d/roboshop.conf
  
  - name: restart nginx frontend
    service:
      name: nginx
      state: restarted
