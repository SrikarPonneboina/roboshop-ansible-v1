- name: configure shipping server
  hosts: shipping
  become: true
  tasks:
  - name: 1. Enable maven 3.9 module stream via DNF
    command: dnf module enable maven:3.9 -y

  - name: 2. Install Maven and OpenJDK 25 Development Kit
    dnf:
      name: 
        - maven
        - java-25-openjdk-devel
        - maven-openjdk25
        - mysql
      state: present

  # - name: Set Java 25 as the system default using alternatives
  #   alternatives:
  #     name: java
  #     path: /usr/lib/jvm/java-25-openjdk-25.0.1.0.8-1.el9.x86_64/bin/java

  # - name: 4. Configure permanent JAVA_HOME environment variable
  #   ansible.builtin.shell: |
  #     echo "export JAVA_HOME=$(dirname $(dirname $(readlink -f /usr/bin/java)))" > /etc/profile.d/java.sh
  #     source /etc/profile.d/java.sh
  #   args:  # arguments lets you define additional behaviours like changing directories, setting specific environments, or defining executables.
  #     chdir: /app # here it executes the command
  #     executable: /bin/bash  # when you use the ansible.builtin.shell module, Ansible uses whatever default shell is configured on the target system (usually /bin/sh).

  - name: create roboshop system user
    user:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      comment: "roboshop system user"

  - name: remove the directory if exists
    file:
      path: /app
      state: absent
  
  - name: remove the downloaded code if present in /tmp
    file: 
      path: /tmp/shipping.zip
      state: absent
  
  - name: create the app directory
    file: 
      path: /app
      state: directory
  
  - name: download the code shipping.zip to /tmp
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip
      dest: /tmp/shipping.zip

  - name: unzip the downloaded code to /app directory
    unarchive:
      src: /tmp/shipping.zip
      dest: /app
      remote_src: yes
  
  - name: mvn version without JAVA_HOME
    command: mvn --version
    args:
      chdir: /app
      executable: /bin/bash
    register: mvn_default
    tags:
    - test
  
  - name: print the mvn version output
    debug: 
      msg: "{{ mvn_default.stdout_lines }}"
    tags:
    - test

  - name: Build application package using maven
    command: mvn clean package
    args:
      chdir: /app
      executable: /bin/bash
      # Runs 'mvn clean package' inside /app using bash, then moves the output jar to /app
    tags:
    - test

  - name: move shipping jar file
    command: mv target/shipping.jar shipping.jar 
    args:
      chdir: /app
      executable: /bin/bash
    tags:
    - test
  

    
