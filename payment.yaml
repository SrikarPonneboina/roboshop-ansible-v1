- name: configure and deploy payment component
  hosts: payment
  become: true
  tasks:
  - name: install python3.14
    dnf:
      name: 
       - python3.14
       - python3.14-pip
      state: present
  
  - name: create roboshop system user
    user:
      name: roboshop
      create_home: false
      home: /app
      shell: /sbin/nologin
      system: true
      comment: "roboshop system user"
  
  - name: remove app directory if exists
    file:
      path: /app
      state: absent
    
  - name: remove /tmp payment.zip file if exists
    file:
      path: /tmp/payment.zip
      state: absent
  
  - name: create app directory
    file:
      path: /app
      state: directory
  
  - name: download payment code from url
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/payment-v4.zip
      dest: /tmp/payment.zip
    
  - name: unarchive payment.zip code
    unarchive:
      src: /tmp/payment.zip
      dest: /app
      remote_src: true
  
  - name: install dependencies in virtual environment
    pip:
      requirements: /app/requirements.txt
      virtualenv: /app/.venv 
      virtualenv_command: python3.14 -m venv
  
  - name: copy payment service
    template:
      src: payment.service.j2
      dest: /etc/systemd/system/payment.service

  - name: daemon-reload, enable and start service
    service:
      daemon_reload: true
      name: payment
      state: restarted
      enabled: true
    
