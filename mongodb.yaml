- name: setting up mongodb
  hosts: mongodb
  become: true
  tasks:
  - name: copy mongodb repo
    copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

  - name: install mongodb
    package:
      name: mongodb-org
      state: present
  
  - name: enable and start service
    service:
      name: mongod 
      state: started
      enabled: yes
  
  - name: setting up remote connections
    ansible.builtin.replace:
      path: /etc/mongod.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0'
  
  - name: restart mongodb
    service:
      name: mongod
      state: restarted


